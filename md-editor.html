<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Markdown → PDF</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --accent: #27BFC8;
    --ink: #10201F;
    --slate: #52696C;
    --border: #DCE1E1;
    --panel: #F7F9F9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #ffffff;
  }

  .app-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: #ffffff;
  }

  .app-bar h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
  }

  .export-btn {
    background: var(--accent);
    color: #ffffff;
    border: none;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
  }

  .export-btn:hover { background: #1FA6AE; }
  .export-btn:disabled { background: #A9DADD; cursor: wait; }

  .status {
    font-size: 12px;
    color: var(--slate);
    margin-right: 12px;
  }

  .status.error { color: #C0392B; }

  .workspace {
    display: flex;
    height: calc(100vh - 49px);
  }

  .pane {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
  }

  .editor-pane {
    border-right: 1px solid var(--border);
    background: var(--panel);
  }

  #source {
    width: 100%;
    height: 100%;
    border: none;
    resize: none;
    padding: 20px;
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    background: transparent;
    outline: none;
  }

  .preview-pane {
    position: relative;
    padding: 40px 48px;
  }

  .watermark {
    position: absolute;
    top: 24px;
    right: 32px;
  }

  .watermark img { height: 50px; }

  #preview h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 6px;
    letter-spacing: -0.3px;
  }

  #preview h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 28px 0 12px;
    padding-left: 10px;
    border-left: 3px solid var(--accent);
  }

  #preview h3 { font-size: 15px; margin: 20px 0 8px; }
  #preview p { font-size: 13.5px; line-height: 1.6; color: var(--ink); }

  #preview hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  #preview table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    border: 1px solid #C7CDCD;
    margin-bottom: 16px;
  }

  #preview th {
    background: #EDEFEF;
    text-align: left;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 8px 12px;
    border-bottom: 2px solid var(--accent);
    border-right: 1px solid #C7CDCD;
  }

  #preview th:last-child { border-right: none; }

  #preview td {
    padding: 9px 12px;
    border-top: 1px solid #C7CDCD;
    border-right: 1px solid #C7CDCD;
    vertical-align: top;
  }

  #preview td:last-child { border-right: none; }

  #preview tr td:first-child {
    color: var(--slate);
    font-weight: 600;
    white-space: nowrap;
  }

  #preview code {
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 12.5px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: #1C8A91;
    padding: 1px 5px;
    border-radius: 4px;
    word-break: break-all;
  }

  #preview pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    overflow-x: auto;
  }

  #preview pre code { background: none; border: none; padding: 0; }
  #preview a { color: var(--accent); }
  #preview ul, #preview ol { font-size: 13.5px; line-height: 1.6; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(16, 32, 31, 0.45);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #ffffff;
    border-radius: 10px;
    width: 92vw;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(16, 32, 31, 0.25);
  }

  .modal.wide { max-width: 900px; }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .modal-header h2 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
    text-transform: none;
    letter-spacing: normal;
    border-left: none;
    padding-left: 0;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 18px;
    line-height: 1;
    color: var(--slate);
    cursor: pointer;
    padding: 4px;
  }

  .modal-body { padding: 20px; }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }

  .option-group { margin-bottom: 20px; }
  .option-group:last-child { margin-bottom: 0; }

  .option-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 8px;
    display: block;
  }

  .option-row {
    display: flex;
    gap: 8px;
  }

  .option-choice {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    background: #ffffff;
  }

  .option-choice.selected {
    border-color: var(--accent);
    background: rgba(39, 191, 200, 0.08);
    color: var(--accent);
    font-weight: 600;
  }

  .btn {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--ink);
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .btn-primary:hover { background: #1FA6AE; }
  .btn:disabled { opacity: 0.5; cursor: wait; }

  .preview-frame-wrap {
    padding: 0 20px 20px;
  }

  #resultFrame {
    width: 100%;
    height: 60vh;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .modal-status {
    font-size: 13px;
    color: var(--slate);
    text-align: center;
    padding: 40px 20px;
  }

  .modal-status.error { color: #C0392B; }
</style>
</head>
<body>

<div class="app-bar">
  <h1>Markdown → PDF</h1>
  <div style="display: flex; align-items: center;">
    <span class="status" id="status"></span>
    <button class="export-btn" id="exportBtn">Export</button>
  </div>
</div>

<!-- Options modal -->
<div class="modal-overlay" id="optionsOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Export options</h2>
      <button class="modal-close" id="optionsClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="option-group">
        <span class="option-label">Page size</span>
        <div class="option-row" id="pageSizeRow">
          <div class="option-choice selected" data-value="A4">A4</div>
          <div class="option-choice" data-value="Letter">Letter</div>
        </div>
      </div>
      <div class="option-group">
        <span class="option-label">Watermark</span>
        <div class="option-row" id="watermarkRow">
          <div class="option-choice selected" data-value="on">With logo</div>
          <div class="option-choice" data-value="off">Without logo</div>
        </div>
      </div>
      <div class="option-group">
        <span class="option-label">Format</span>
        <div class="option-row" id="formatRow">
          <div class="option-choice selected" data-value="pdf">PDF</div>
          <div class="option-choice" data-value="html">HTML</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="optionsCancel">Cancel</button>
      <button class="btn btn-primary" id="optionsGenerate">Generate</button>
    </div>
  </div>
</div>

<!-- Preview + download modal -->
<div class="modal-overlay" id="previewOverlay">
  <div class="modal wide">
    <div class="modal-header">
      <h2>Preview</h2>
      <button class="modal-close" id="previewClose" aria-label="Close">✕</button>
    </div>
    <div id="previewBody">
      <div class="modal-status" id="previewStatus">Generating…</div>
      <div class="preview-frame-wrap" id="previewFrameWrap" style="display: none;">
        <iframe id="resultFrame"></iframe>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="previewBack">Back to options</button>
      <button class="btn btn-primary" id="previewDownload" disabled>Download</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_MD = `# Aadarsh — Credentials Handover

**Live URL** — https://aadarshfoods.com

---

## Tech Stack

| Layer | Technology |
|---|---|
| Framework | Next.js |
| Database | SQLite |

## Server

| Item | Value |
|---|---|
| Provider | DigitalOcean |
| Droplet plan | 1 vCPU · 1 GB RAM · 25 GB Disk — $6.00/mo |
| App path | \`/var/www/aadarsh\` |
| Process manager | PM2 — \`pm2 restart aadarsh\` |

---

For more information, contact 8views.
`;

  const source = document.getElementById('source');
  const preview = document.getElementById('preview');
  const exportBtn = document.getElementById('exportBtn');

  function render() {
    preview.innerHTML = marked.parse(source.value);
  }

  source.value = DEFAULT_MD;
  source.addEventListener('input', render);
  render();

  // ---------- Options modal ----------
  const optionsOverlay = document.getElementById('optionsOverlay');
  const previewOverlay = document.getElementById('previewOverlay');
  const optionsClose = document.getElementById('optionsClose');
  const optionsCancel = document.getElementById('optionsCancel');
  const optionsGenerate = document.getElementById('optionsGenerate');

  const state = { pageSize: 'A4', watermark: 'on', format: 'pdf' };

  function wireChoiceRow(rowId, stateKey) {
    const row = document.getElementById(rowId);
    row.querySelectorAll('.option-choice').forEach((el) => {
      el.addEventListener('click', () => {
        row.querySelectorAll('.option-choice').forEach((c) => c.classList.remove('selected'));
        el.classList.add('selected');
        state[stateKey] = el.dataset.value;
      });
    });
  }

  wireChoiceRow('pageSizeRow', 'pageSize');
  wireChoiceRow('watermarkRow', 'watermark');
  wireChoiceRow('formatRow', 'format');

  function openOptions() { optionsOverlay.classList.add('open'); }
  function closeOptions() { optionsOverlay.classList.remove('open'); }

  exportBtn.addEventListener('click', openOptions);
  optionsClose.addEventListener('click', closeOptions);
  optionsCancel.addEventListener('click', closeOptions);

  // ---------- Preview / download modal ----------
  const previewClose = document.getElementById('previewClose');
  const previewBack = document.getElementById('previewBack');
  const previewDownload = document.getElementById('previewDownload');
  const previewStatus = document.getElementById('previewStatus');
  const previewFrameWrap = document.getElementById('previewFrameWrap');
  const resultFrame = document.getElementById('resultFrame');

  let resultBlob = null;
  let resultUrl = null;

  function openPreview() { previewOverlay.classList.add('open'); }
  function closePreview() {
    previewOverlay.classList.remove('open');
    if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
    resultFrame.src = 'about:blank';
  }

  previewClose.addEventListener('click', closePreview);
  previewBack.addEventListener('click', () => { closePreview(); openOptions(); });

  optionsGenerate.addEventListener('click', async () => {
    closeOptions();
    resultBlob = null;
    previewDownload.disabled = true;
    previewFrameWrap.style.display = 'none';
    previewStatus.style.display = 'block';
    previewStatus.textContent = 'Generating…';
    previewStatus.classList.remove('error');
    openPreview();

    try {
      if (state.format === 'html') {
        const html = buildStandaloneHtml(source.value, state.watermark === 'on');
        resultBlob = new Blob([html], { type: 'text/html' });
      } else {
        const res = await fetch('/export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            markdown: source.value,
            pageSize: state.pageSize,
            watermark: state.watermark === 'on',
          }),
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || 'Server error');
        }
        resultBlob = await res.blob();
      }

      resultUrl = URL.createObjectURL(resultBlob);
      resultFrame.src = resultUrl;
      previewStatus.style.display = 'none';
      previewFrameWrap.style.display = 'block';
      previewDownload.disabled = false;
    } catch (err) {
      previewStatus.textContent = 'Failed: ' + err.message;
      previewStatus.classList.add('error');
    }
  });

  previewDownload.addEventListener('click', () => {
    if (!resultBlob) return;
    const a = document.createElement('a');
    a.href = resultUrl;
    a.download = state.format === 'html' ? 'document.html' : 'document.pdf';
    a.click();
  });

  function buildStandaloneHtml(mdSource, withWatermark) {
    const bodyHtml = marked.parse(mdSource);
    const watermarkHtml = withWatermark
      ? `<div style="position: fixed; top: 24px; right: 32px;"><img src="${document.querySelector('.watermark img').src}" style="height: 50px;"></div>`
      : '';
    const styles = document.querySelector('style').textContent;
    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${styles}</style></head><body style="padding: 40px 48px; position: relative;">${watermarkHtml}<div id="preview">${bodyHtml}</div></body></html>`;
  }
